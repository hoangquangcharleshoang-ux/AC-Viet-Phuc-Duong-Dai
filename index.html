    <script>
      (function() {
        try {
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && protoDesc.get && !protoDesc.set) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: protoDesc.get,
                set: function(val) {
                  Object.defineProperty(this, 'fetch', {
                    value: val,
                    writable: true,
                    configurable: true,
                    enumerable: true
                  });
                },
                configurable: true,
                enumerable: true
              });
            }
          }
          if (typeof window !== 'undefined') {
            var currentFetch = window.fetch;
            if (typeof currentFetch === 'function') {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(newFetch) {
                  currentFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (_) {}
      })();
    </script>
